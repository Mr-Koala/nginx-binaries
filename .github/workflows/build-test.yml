name: Build Test
on:
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'Nginx version to build'
        required: true
        default: '1.28.x'
        type: choice
        options:
          - '1.18.x'
          - '1.20.x'
          - '1.22.x'
          - '1.24.x'
          - '1.26.x'
          - '1.27.x'
          - '1.28.x'
          - '1.29.x'
      variant:
        description: 'Build variant'
        required: true
        default: 'stream'
        type: choice
        options:
          - 'default'
          - 'stream'
      architecture:
        description: 'Target architecture'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'
          - 'aarch64'
      platform:
        description: 'Target platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - 'linux'
          - 'darwin'
      build_njs:
        description: 'Also build njs'
        required: true
        default: false
        type: boolean
      njs_version:
        description: 'NJS version to build'
        required: false
        default: '0.8.x'
        type: string

env:
  ALPINE_BRANCH: v3.20
  NGINX_MODULES: >-
    openresty/echo-nginx-module
    openresty/headers-more-nginx-module
    vision5/ngx_devel_kit
    openresty/set-misc-nginx-module
    kjdev/nginx-auth-jwt
    kjdev/nginx-keyval
  CFLAGS: -Os -fomit-frame-pointer -pipe
  LINUX_LDFLAGS: -static
  DARWIN_LDFLAGS: -static-libgcc

jobs:
  build-nginx:
    name: nginx-${{ inputs.nginx_version }}-${{ inputs.variant }}-${{ inputs.architecture }}-${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-latest' || 'macos-latest' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract nginx
        run: ./scripts/fetch-sources -d . nginx/nginx@release-${{ inputs.nginx_version }}

      - name: Download and extract nginx modules
        run: ./scripts/fetch-sources nginx/njs@0.x.x $NGINX_MODULES

      # Linux 构建
      - name: Install Alpine ${{ env.ALPINE_BRANCH }} for ${{ inputs.architecture }}
        if: inputs.platform == 'linux'
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ inputs.architecture }}
          branch: ${{ env.ALPINE_BRANCH }}
          packages: >
            build-base
            jansson-dev
            jansson-static
            linux-headers
            openssl-dev
            openssl-libs-static
            pcre-dev
            zlib-dev
            zlib-static

      - name: Build nginx (Linux)
        if: inputs.platform == 'linux'
        env:
          NGINX_MODULES: nginx/njs ${{ env.NGINX_MODULES }}
          VARIANT: ${{ inputs.variant == 'stream' && '-stream' || '' }}
          CFLAGS: ${{ env.CFLAGS }}
          LDFLAGS: ${{ env.LINUX_LDFLAGS }}
        run: ./scripts/build-nginx
        shell: alpine.sh {0}

      # macOS 构建
      - name: Install dependencies (macOS)
        if: inputs.platform == 'darwin'
        run: brew install gsed jansson jq openssl@3 pcre zlib

      - name: Remove dylibs (macOS)
        if: inputs.platform == 'darwin'
        run: |
          rm /opt/homebrew/opt/jansson/lib/*.dylib
          rm /opt/homebrew/opt/openssl/lib/*.dylib
          rm /opt/homebrew/opt/pcre/lib/*.dylib
          rm /opt/homebrew/opt/zlib/lib/*.dylib

      - name: Build nginx (macOS)
        if: inputs.platform == 'darwin'
        env:
          NGINX_MODULES: nginx/njs ${{ env.NGINX_MODULES }}
          VARIANT: ${{ inputs.variant == 'stream' && '-stream' || '' }}
          CFLAGS: ${{ env.CFLAGS }} -I/opt/homebrew/opt/jansson/include -I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/pcre/include -I/opt/homebrew/opt/zlib/include
          LDFLAGS: ${{ env.DARWIN_LDFLAGS }} -L/opt/homebrew/opt/jansson/lib -L/opt/homebrew/opt/openssl/lib -L/opt/homebrew/opt/pcre/lib -L/opt/homebrew/opt/zlib/lib
        run: ./scripts/build-nginx

      - name: Upload nginx binary
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ inputs.nginx_version }}-${{ inputs.variant }}-${{ inputs.architecture }}-${{ inputs.platform }}
          path: artifact/*

  build-njs:
    name: njs-${{ inputs.njs_version }}-${{ inputs.architecture }}-${{ inputs.platform }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-latest' || 'macos-latest' }}
    if: inputs.build_njs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and extract njs
        run: ./scripts/fetch-sources -d . nginx/njs@${{ inputs.njs_version }}

      # Linux 构建
      - name: Install Alpine ${{ env.ALPINE_BRANCH }} for ${{ inputs.architecture }}
        if: inputs.platform == 'linux'
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ inputs.architecture }}
          branch: ${{ env.ALPINE_BRANCH }}
          packages: >
            build-base
            linux-headers
            openssl-dev
            openssl-libs-static
            pcre-dev
            zlib-dev
            zlib-static

      - name: Build njs (Linux)
        if: inputs.platform == 'linux'
        env:
          CFLAGS: ${{ env.CFLAGS }}
          LDFLAGS: ${{ env.LINUX_LDFLAGS }}
        run: ./scripts/build-njs
        shell: alpine.sh {0}

      # macOS 构建
      - name: Install dependencies (macOS)
        if: inputs.platform == 'darwin'
        run: brew install gsed jq openssl@3 pcre zlib

      - name: Remove dylibs (macOS)
        if: inputs.platform == 'darwin'
        run: |
          rm /opt/homebrew/opt/openssl/lib/*.dylib
          rm /opt/homebrew/opt/pcre/lib/*.dylib
          rm /opt/homebrew/opt/zlib/lib/*.dylib

      - name: Build njs (macOS)
        if: inputs.platform == 'darwin'
        env:
          CFLAGS: ${{ env.CFLAGS }} -I/opt/homebrew/opt/openssl/include -I/opt/homebrew/opt/pcre/include -I/opt/homebrew/opt/zlib/include
          LDFLAGS: ${{ env.DARWIN_LDFLAGS }} -L/opt/homebrew/opt/openssl/lib -L/opt/homebrew/opt/pcre/lib -L/opt/homebrew/opt/zlib/lib
        run: ./scripts/build-njs

      - name: Upload njs binary
        uses: actions/upload-artifact@v4
        with:
          name: njs-${{ inputs.njs_version }}-${{ inputs.architecture }}-${{ inputs.platform }}
          path: artifact/*