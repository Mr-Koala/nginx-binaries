# nginx configuration with stream (TCP/UDP proxy) support
# This configuration demonstrates TCP/UDP load balancing capabilities

# Main context
user nobody;
worker_processes auto;
error_log stderr;
pid nginx.pid;

# Events context
events {
    worker_connections 1024;
    use epoll;
}

# HTTP context (optional, can coexist with stream)
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    
    server {
        listen 80;
        server_name localhost;
        
        location / {
            return 200 "HTTP server is working\n";
            add_header Content-Type text/plain;
        }
        
        location /status {
            return 200 "nginx with stream support is running\n";
            add_header Content-Type text/plain;
        }
    }
}

# Stream context for TCP/UDP proxying
stream {
    # Define upstream servers for MySQL load balancing
    upstream mysql_backend {
        server 192.168.1.10:3306 weight=3;
        server 192.168.1.11:3306 weight=2;
        server 192.168.1.12:3306 backup;
    }
    
    # Define upstream servers for Redis
    upstream redis_backend {
        server 192.168.1.20:6379;
        server 192.168.1.21:6379;
    }
    
    # Define upstream for PostgreSQL
    upstream postgres_backend {
        server 192.168.1.30:5432;
        server 192.168.1.31:5432;
    }
    
    # MySQL proxy server
    server {
        listen 3306;
        proxy_pass mysql_backend;
        proxy_timeout 1s;
        proxy_responses 1;
        proxy_bind $remote_addr transparent;
    }
    
    # Redis proxy server
    server {
        listen 6379;
        proxy_pass redis_backend;
        proxy_timeout 3s;
        proxy_responses 1;
    }
    
    # PostgreSQL proxy server
    server {
        listen 5432;
        proxy_pass postgres_backend;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    # SSL passthrough example (SNI-based routing)
    map $ssl_preread_server_name $backend_pool {
        app1.example.com app1_backend;
        app2.example.com app2_backend;
        default          default_backend;
    }
    
    upstream app1_backend {
        server 192.168.1.40:443;
    }
    
    upstream app2_backend {
        server 192.168.1.50:443;
    }
    
    upstream default_backend {
        server 192.168.1.60:443;
    }
    
    # SSL passthrough server
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend_pool;
        proxy_timeout 3s;
    }
    
    # UDP load balancing example (DNS)
    upstream dns_backend {
        server 8.8.8.8:53;
        server 8.8.4.4:53;
    }
    
    server {
        listen 53 udp;
        proxy_pass dns_backend;
        proxy_timeout 1s;
        proxy_responses 1;
    }
    
    # TCP proxy with access control
    server {
        listen 8080;
        proxy_pass 192.168.1.100:8080;
        
        # Allow specific IP ranges
        allow 192.168.1.0/24;
        allow 10.0.0.0/8;
        deny all;
    }
}